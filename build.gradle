plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.11.0'
group = 'com.ironsbotany'

base {
    archivesName = 'ironsbotany'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'ironsbotany'

            mods {
                ironsbotany {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'ironsbotany'

            mods {
                ironsbotany {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'ironsbotany',
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')

            mods {
                ironsbotany {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
    maven {
        name = "Curios maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.16'
    
    // Use local JARs from libs folder - compileOnly to avoid deobf issues
    compileOnly files('libs/Botania-1.20.1-450-FORGE.jar')
    // Iron's Botany 1.8.1 targets Iron's Spells 3.16+. ISS 3.16 changed the Scroll
    // constructor (no-arg -> Scroll(Item.Properties)), a hard ABI break that makes the
    // Elementium Scroll incompatible with 3.15.2, so 3.15.2 is no longer supported.
    compileOnly files("libs/${project.findProperty('iss_jar') ?: 'irons_spellbooks-1.20.1-3.16.1.jar'}")
    compileOnly files('libs/curios-forge-5.14.1+1.20.1.jar')

    compileOnly files('libs/Patchouli-1.20.1-84.1-FORGE.jar')
    compileOnly files('libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar')

    // Unit/contract tests. See src/test/java/.../package-info.java for what this
    // layer can and cannot cover: the dependency JARs in libs/ are *production*
    // artifacts compiled against SRG names (m_7383_ etc.), so they cannot be
    // linked in a Mojang-mapped dev runtime. Tests therefore exercise our own
    // logic and the Minecraft classes it hands to those dependencies, never the
    // dependency classes themselves.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Present so classes whose *signatures* mention dependency types can be loaded and their
    // dependency-free logic exercised. Constant-pool entries resolve lazily, so a test that never
    // calls into Botania/ISS never triggers the SRG-vs-Mojang mismatch. A test that does call in
    // will fail loudly rather than silently pass, which is the behaviour we want.
    testImplementation files('libs/Botania-1.20.1-450-FORGE.jar')
    testImplementation files('libs/irons_spellbooks-1.20.1-3.16.1.jar')
    testImplementation files('libs/curios-forge-5.14.1+1.20.1.jar')
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version: '47.4.16',
            forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: 'ironsbotany',
            mod_name: "Iron's Botany",
            mod_license: 'MIT',
            mod_version: version,
            mod_authors: 'IronsBotany Team',
            mod_description: 'A compatibility mod bridging Botania and Iron\'s Spells \'n Spellbooks'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// Asset-integrity validation
//
// Fails the build if any model / blockstate / particle JSON references a
// texture or model that does not exist, or if any registered spell is missing
// its icon. This is the guard that would have caught the missing
// arcane_mana_altar.png (the v1.8.0 purple/black bug). Wired into `check`, so
// `build` runs it automatically.
// ---------------------------------------------------------------------------
tasks.register('validateAssets') {
    group = 'verification'
    description = 'Verify every referenced texture/model/spell-icon resolves to a real file.'

    def assets = file('src/main/resources/assets/ironsbotany')
    def javaSrc = file('src/main/java')

    doLast {
        def json = new groovy.json.JsonSlurper()
        def errors = []

        // Resolve an "ironsbotany:<path>" texture ref to its PNG file.
        def texFile = { String ref ->
            if (ref == null) return null
            def path = ref.contains(':') ? ref.substring(ref.indexOf(':') + 1) : ref
            new File(assets, "textures/${path}.png")
        }
        // Resolve an "ironsbotany:<path>" model ref to its JSON file (skip vanilla/other namespaces).
        def modelFile = { String ref ->
            if (ref == null) return null
            if (ref.contains(':') && !ref.startsWith('ironsbotany:')) return null
            def path = ref.contains(':') ? ref.substring(ref.indexOf(':') + 1) : ref
            new File(assets, "models/${path}.json")
        }
        def checkPng = { File png, String origin ->
            if (png == null) return
            if (!png.exists()) errors << "${origin}: missing texture -> ${png}"
            else if (png.length() == 0L) errors << "${origin}: zero-byte texture -> ${png}"
        }

        // 1 + 2. Item and block models: every texture ref + ironsbotany parent must resolve.
        ['models/item', 'models/block'].each { dir ->
            def d = new File(assets, dir)
            if (!d.isDirectory()) return
            d.listFiles({ f -> f.name.endsWith('.json') } as FileFilter).each { f ->
                def m = json.parse(f)
                m.textures?.each { k, v -> if (v instanceof String && !v.startsWith('#')) checkPng(texFile(v), "${dir}/${f.name} [${k}]") }
                if (m.parent instanceof String) {
                    def pf = modelFile(m.parent)
                    if (pf != null && !pf.exists()) errors << "${dir}/${f.name}: missing parent model -> ${pf}"
                }
            }
        }

        // 3. Particle definitions: every sprite in the textures[] list must resolve.
        def pd = new File(assets, 'particles')
        if (pd.isDirectory()) {
            pd.listFiles({ f -> f.name.endsWith('.json') } as FileFilter).each { f ->
                json.parse(f).textures?.each { s -> checkPng(texFile(s), "particles/${f.name}") }
            }
        }

        // 4. Blockstates: every referenced block model must exist.
        def bs = new File(assets, 'blockstates')
        if (bs.isDirectory()) {
            bs.listFiles({ f -> f.name.endsWith('.json') } as FileFilter).each { f ->
                def data = json.parse(f)
                def refs = [] as Set
                data.variants?.each { k, v -> (v instanceof List ? v : [v]).each { if (it?.model) refs << it.model } }
                data.multipart?.each { part -> def a = part.apply; (a instanceof List ? a : [a]).each { if (it?.model) refs << it.model } }
                refs.each { r -> def mf = modelFile(r); if (mf != null && !mf.exists()) errors << "blockstates/${f.name}: missing model -> ${mf}" }
            }
        }

        // 5. Spell icons: every id registered in IBSpells must have a GUI icon PNG.
        def ibSpells = new File(javaSrc, 'com/ironsbotany/common/registry/IBSpells.java')
        if (ibSpells.exists()) {
            def matcher = ibSpells.text =~ /SPELLS\.register\("([a-z0-9_]+)"/
            while (matcher.find()) {
                def id = matcher.group(1)
                checkPng(new File(assets, "textures/gui/spell_icons/${id}.png"), "IBSpells spell '${id}'")
            }
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Asset validation failed (${errors.size()} problem(s)):\n  " + errors.join('\n  '))
        }
        logger.lifecycle("validateAssets: all texture/model/spell-icon references resolve.")
    }
}

// ---------------------------------------------------------------------------
// Final-artifact validation
//
// validateAssets (above) checks the SOURCE tree. This task checks the JAR that
// will actually be published, which is the only thing a player ever runs. The
// 1.9.0 investigation could not rule out a release-pipeline defect — a public
// download differing from the tagged source — precisely because no such gate
// existed. Every check here is on bytes read back out of the built archive.
// ---------------------------------------------------------------------------
tasks.register('validateArtifact') {
    group = 'verification'
    description = 'Decode every PNG in the built JAR and verify every asset reference resolves inside it.'

    dependsOn tasks.named('jar')
    def jarProvider = tasks.named('jar').flatMap { it.archiveFile }
    def spellsSource = file('src/main/java/com/ironsbotany/common/registry/IBSpells.java')
    inputs.file(jarProvider)
    inputs.file(spellsSource)

    doLast {
        def archive = jarProvider.get().asFile
        def json = new groovy.json.JsonSlurper()
        def errors = []
        def zip = new java.util.zip.ZipFile(archive)

        try {
            def names = zip.entries().collect { it.name } as Set
            def read = { String name -> zip.getInputStream(zip.getEntry(name)).bytes }
            def has = { String name -> names.contains(name) }

            // Resolve "ns:path" refs to their JAR entry paths. Only ironsbotany assets can be
            // asserted here — vanilla and dependency namespaces live in other archives.
            def texEntry = { String ref ->
                if (!(ref instanceof String) || ref.startsWith('#')) return null
                def ns = ref.contains(':') ? ref.substring(0, ref.indexOf(':')) : 'minecraft'
                def path = ref.contains(':') ? ref.substring(ref.indexOf(':') + 1) : ref
                ns == 'ironsbotany' ? "assets/ironsbotany/textures/${path}.png" : null
            }
            def modelEntry = { String ref ->
                if (!(ref instanceof String)) return null
                if (ref.contains(':') && !ref.startsWith('ironsbotany:')) return null
                def path = ref.contains(':') ? ref.substring(ref.indexOf(':') + 1) : ref
                ref.contains(':') ? "assets/ironsbotany/models/${path}.json" : null
            }

            // 1. Every PNG in the artifact must decode, have non-zero dimensions, and contain at
            //    least one visible pixel. A zero-byte or fully transparent texture renders as
            //    nothing or as the missing-texture swatch in game but passes a mere existence check.
            def pngs = names.findAll { it.endsWith('.png') }
            if (pngs.isEmpty()) errors << "the artifact contains no PNGs at all"
            pngs.each { name ->
                def img
                try {
                    img = javax.imageio.ImageIO.read(new ByteArrayInputStream(read(name)))
                } catch (Exception e) {
                    errors << "${name}: PNG failed to decode -> ${e.message}"
                    return
                }
                if (img == null) { errors << "${name}: not a decodable image"; return }
                if (img.width <= 0 || img.height <= 0) { errors << "${name}: ${img.width}x${img.height}"; return }

                boolean visible = false
                for (int y = 0; y < img.height && !visible; y++) {
                    for (int x = 0; x < img.width && !visible; x++) {
                        if ((img.getRGB(x, y) >>> 24) != 0) visible = true
                    }
                }
                if (!visible) errors << "${name}: fully transparent — would render as nothing"

                // Spell icons are drawn into a fixed 16x16 GUI slot by Iron's Spells.
                if (name.contains('/textures/gui/spell_icons/') && (img.width != 16 || img.height != 16)) {
                    errors << "${name}: spell icons must be 16x16 but this is ${img.width}x${img.height}"
                }
            }

            // 2. Every texture and parent referenced by a packaged model must be packaged too.
            names.findAll { it.startsWith('assets/ironsbotany/models/') && it.endsWith('.json') }.each { name ->
                def model = json.parse(read(name), 'UTF-8')
                model.textures?.each { k, v ->
                    def entry = texEntry(v as String)
                    if (entry != null && !has(entry)) errors << "${name} [${k}]: missing texture ${entry}"
                }
                def parent = modelEntry(model.parent as String)
                if (parent != null && !has(parent)) errors << "${name}: missing parent model ${parent}"
            }

            // 3. Blockstate variants must point at packaged models.
            names.findAll { it.startsWith('assets/ironsbotany/blockstates/') && it.endsWith('.json') }.each { name ->
                def data = json.parse(read(name), 'UTF-8')
                def refs = [] as Set
                data.variants?.each { k, v -> (v instanceof List ? v : [v]).each { if (it?.model) refs << it.model } }
                data.multipart?.each { p -> def a = p.apply; (a instanceof List ? a : [a]).each { if (it?.model) refs << it.model } }
                refs.each { r ->
                    def entry = modelEntry(r as String)
                    if (entry != null && !has(entry)) errors << "${name}: missing model ${entry}"
                }
            }

            // 4. Particle definitions must point at packaged sprites.
            names.findAll { it.startsWith('assets/ironsbotany/particles/') && it.endsWith('.json') }.each { name ->
                json.parse(read(name), 'UTF-8').textures?.each { s ->
                    def entry = texEntry(s as String)
                    if (entry != null && !has(entry)) errors << "${name}: missing sprite ${entry}"
                }
            }

            // 5. Every registered spell must ship an icon at the path Iron's Spells derives:
            //    <namespace>:textures/gui/spell_icons/<spellName>.png. This is a build-time
            //    cross-check of the registration source; the authoritative check runs against the
            //    live spell registry at runtime (SpellIconIntegrityCheck), because only the game
            //    can enumerate what actually registered.
            def declared = [] as Set
            if (spellsSource.exists()) {
                def matcher = spellsSource.text =~ /SPELLS\.register\("([a-z0-9_]+)"/
                while (matcher.find()) declared << matcher.group(1)
            }
            if (declared.isEmpty()) errors << "could not read any spell registrations from ${spellsSource.name}"
            declared.each { id ->
                def entry = "assets/ironsbotany/textures/gui/spell_icons/${id}.png"
                if (!has(entry)) errors << "spell '${id}' is registered but ${entry} is not in the artifact"
            }
            def packaged = names.findAll { it.startsWith('assets/ironsbotany/textures/gui/spell_icons/') && it.endsWith('.png') }
                                .collect { it.substring(it.lastIndexOf('/') + 1) - '.png' } as Set
            (packaged - declared).each { errors << "orphan spell icon '${it}.png' matches no registered spell" }

            // 6. Language parity. Every key en_us defines must exist in every other language file,
            //    or the difference must be a deliberate, listed fallback.
            def langs = names.findAll { it.startsWith('assets/ironsbotany/lang/') && it.endsWith('.json') }
            def enUs = langs.find { it.endsWith('/en_us.json') }
            if (enUs == null) {
                errors << "assets/ironsbotany/lang/en_us.json is missing from the artifact"
            } else {
                def base = json.parse(read(enUs), 'UTF-8').keySet()
                (langs - enUs).each { name ->
                    def keys = json.parse(read(name), 'UTF-8').keySet()
                    def missing = base - keys
                    if (!missing.isEmpty()) {
                        logger.lifecycle("validateArtifact: ${name - 'assets/ironsbotany/lang/'} falls back to en_us for ${missing.size()} key(s)")
                    }
                    def extra = keys - base
                    if (!extra.isEmpty()) {
                        errors << "${name}: defines ${extra.size()} key(s) absent from en_us -> ${extra.take(5)}"
                    }
                }
            }

            // 7. Metadata the loader needs.
            ['META-INF/mods.toml', 'pack.mcmeta'].each { if (!has(it)) errors << "missing ${it}" }

            if (!errors.isEmpty()) {
                throw new GradleException(
                        "Final-artifact validation failed for ${archive.name} (${errors.size()} problem(s)):\n  "
                                + errors.join('\n  '))
            }

            def digest = java.security.MessageDigest.getInstance('SHA-256')
            digest.update(archive.bytes)
            logger.lifecycle("validateArtifact: ${archive.name} OK — ${names.size()} entries, ${pngs.size()} PNGs decoded, "
                    + "${declared.size()} spell icons present")
            logger.lifecycle("validateArtifact: sha256 ${digest.digest().encodeHex()}  size ${archive.length()} bytes")
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') { dependsOn 'validateAssets', 'validateArtifact' }
